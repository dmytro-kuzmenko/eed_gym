# Defaults used for the paper baselines.
#   python -m eed_benchmark.rl.trainers.train_ppo --config src/eed_benchmark/configs/default.yaml
# Command-line flags override these values. id_eval --config reads the env block.
env:
  observe_valence: true
  trust_penalty: true
  curriculum: true
  explicit_style: true
  disable_clarify_alt: false
  blame_mode: "off"

training:
  algo: ppo
  total_steps: 600000
  batch_size: 256
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.1
  vf_coef: 0.5
